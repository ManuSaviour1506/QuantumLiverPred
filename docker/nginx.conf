# Static SPA + reverse proxy to the API. TLS is terminated in front of this container (or by the host platform).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 600m;          # dataset archives (API enforces MAX_DATASET_UPLOAD_MB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # live comparison stream (Server-Sent Events): no buffering, long-lived connection
    location ~ ^/api/v1/compare/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
    }
    location ~ ^/(api/|health|openapi\.json|docs) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot inject addresses
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        limit_req zone=api burst=60 nodelay;
    }

    location /assets/ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
